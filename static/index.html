<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NB Remote</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
html { position: fixed; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
body { background: #1a1a2e; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; width: 100%; height: 100%; display: flex; flex-direction: column; position: fixed; touch-action: none; }
#status { padding: 6px 12px; font-size: 13px; background: #16213e; text-align: center; flex-shrink: 0; }
#status.connected { background: #0f3d0f; }
#status.waiting { background: #3d2e0f; }
#canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; touch-action: none; }
canvas { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; cursor: crosshair; -webkit-touch-callout: none; }
#toolbar { display: flex; gap: 4px; padding: 4px 6px; background: #16213e; flex-shrink: 0; justify-content: center; flex-wrap: nowrap; overflow-x: auto; }
#toolbar button { padding: 4px 10px; border: 1px solid #444; border-radius: 4px; background: #0f3460; color: #eee; font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
#toolbar button:active { background: #e94560; }
#toolbar button.active { background: #e94560; border-color: #e94560; }
#kb-bar { display: none; padding: 4px 6px; background: #0a0a1a; flex-shrink: 0; }
#kb-bar.show { display: flex; gap: 6px; align-items: center; }
#kb-bar input { flex: 1; padding: 8px 12px; border: 1px solid #555; border-radius: 6px; background: #1a1a2e; color: #eee; font-size: 16px; outline: none; -webkit-user-select: text; user-select: text; }
#kb-bar input:focus { border-color: #e94560; }
#kb-bar button { padding: 8px 12px; border: 1px solid #444; border-radius: 6px; background: #0f3460; color: #eee; font-size: 14px; cursor: pointer; flex-shrink: 0; }
</style>
</head>
<body>

<div id="status" class="waiting">Connecting... (v2.2)</div>
<div id="canvas-wrap">
  <canvas id="screen"></canvas>
</div>
<div id="toolbar">
  <button id="btn-pause">⏸</button>
  <button id="btn-keyboard">⌨</button>
  <button id="btn-click">L</button>
  <button id="btn-rclick">R</button>
  <button id="btn-esc">Esc</button>
  <button id="btn-tab">Tab</button>
  <button id="btn-enter">⏎</button>
  <button id="btn-bs">⌫</button>
  <button id="btn-winkey">⊞</button>
</div>
<div id="kb-bar">
  <input id="keyboard-input" type="text" placeholder="Type here..." autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
  <button id="btn-send-text">Send</button>
  <button id="btn-kb-close">✕</button>
</div>

<script>
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const kbInput = document.getElementById('keyboard-input');

let ws = null;
let screenW = 1920, screenH = 1080;
let clickMode = 'left';
let connected = false;
let paused = false;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/phone`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    statusEl.textContent = 'Waiting for NB... (v2.2)';
    statusEl.className = 'waiting';
  };

  ws.onmessage = (ev) => {
    if (ev.data instanceof ArrayBuffer) {
      renderFrame(new Blob([ev.data], { type: 'image/jpeg' }));
    } else {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'frame' && msg.data) {
          const bin = atob(msg.data);
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          renderFrame(new Blob([arr], { type: 'image/jpeg' }));
        } else if (msg.type === 'nb_status') {
          connected = msg.connected;
          if (!paused) {
            statusEl.textContent = connected ? '● NB Connected (v2.2)' : 'Waiting for NB... (v2.2)';
            statusEl.className = connected ? 'connected' : 'waiting';
          }
        } else if (msg.type === 'screen_info') {
          screenW = msg.width;
          screenH = msg.height;
        }
      } catch(e) {}
    }
  };

  function renderFrame(blob) {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      if (canvas.width !== img.width || canvas.height !== img.height) {
        canvas.width = img.width;
        canvas.height = img.height;
      }
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  ws.onclose = () => {
    statusEl.textContent = 'Reconnecting...';
    statusEl.className = '';
    connected = false;
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();
}

function send(obj) {
  if (paused) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

function canvasToScreen(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = (clientX - rect.left) * scaleX;
  const cy = (clientY - rect.top) * scaleY;
  const x = Math.round(cx * screenW / canvas.width);
  const y = Math.round(cy * screenH / canvas.height);
  return { x: Math.max(0, Math.min(screenW, x)), y: Math.max(0, Math.min(screenH, y)) };
}

// Touch: tap = click
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  const pos = canvasToScreen(t.clientX, t.clientY);
  send({ type: 'mouse_click', button: clickMode, x: pos.x, y: pos.y });
  clickMode = 'left';
}, { passive: false });

// Mouse click
canvas.addEventListener('click', (e) => {
  const pos = canvasToScreen(e.clientX, e.clientY);
  send({ type: 'mouse_click', button: clickMode, x: pos.x, y: pos.y });
  clickMode = 'left';
});
canvas.addEventListener('dblclick', (e) => {
  e.preventDefault();
  const pos = canvasToScreen(e.clientX, e.clientY);
  send({ type: 'mouse_dblclick', button: 'left', x: pos.x, y: pos.y });
});

// Keyboard input — multiple strategies for desktop + mobile + IME (中文)
let composing = false;
let lastInputLen = 0;

// 1. keydown: catches special keys + desktop typing
kbInput.addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (composing) return; // IME active, wait for compositionend
  const special = {
    'Backspace': 'backspace', 'Delete': 'delete', 'ArrowLeft': 'left',
    'ArrowRight': 'right', 'ArrowUp': 'up', 'ArrowDown': 'down',
    'Enter': 'enter', 'Escape': 'escape', 'Tab': 'tab',
  };
  if (special[e.key]) {
    e.preventDefault();
    send({ type: 'key_special', key: special[e.key] });
  } else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
    e.preventDefault();
    send({ type: 'key_char', char: e.key });
  }
});

// 2. beforeinput: catches mobile backspace when input is empty (keydown may not fire)
kbInput.addEventListener('beforeinput', (e) => {
  if (e.inputType === 'deleteContentBackward') {
    if (kbInput.value.length === 0) {
      e.preventDefault();
      send({ type: 'key_special', key: 'backspace' });
    }
  }
});

// 3. input: catches mobile keyboard letters (keydown may give key='Unidentified')
kbInput.addEventListener('input', (e) => {
  if (composing) return; // IME still composing
  const val = kbInput.value;
  if (val.length > lastInputLen) {
    // New chars added — send them
    const newChars = val.slice(lastInputLen);
    for (const c of newChars) send({ type: 'key_char', char: c });
  } else if (val.length < lastInputLen) {
    // Chars deleted (mobile backspace)
    const deleted = lastInputLen - val.length;
    for (let i = 0; i < deleted; i++) send({ type: 'key_special', key: 'backspace' });
  }
  lastInputLen = val.length;
  // Clear periodically to prevent buildup
  if (val.length > 50) { kbInput.value = ''; lastInputLen = 0; }
});

// 4. compositionstart/end: handles IME input (中文, 日文, etc.)
kbInput.addEventListener('compositionstart', () => { composing = true; });
kbInput.addEventListener('compositionend', (e) => {
  composing = false;
  const text = e.data;
  if (text) {
    for (const c of text) send({ type: 'key_char', char: c });
  }
  kbInput.value = '';
  lastInputLen = 0;
});

// Toolbar
const kbBar = document.getElementById('kb-bar');
let kbOpen = false;

document.getElementById('btn-pause').onclick = () => {
  paused = !paused;
  const btn = document.getElementById('btn-pause');
  btn.textContent = paused ? '▶' : '⏸';
  btn.className = paused ? 'active' : '';
  statusEl.textContent = paused ? '⏸ PAUSED' : (connected ? '● NB Connected (v2.2)' : 'Waiting for NB... (v2.2)');
};
document.getElementById('btn-keyboard').onclick = () => {
  kbOpen = !kbOpen;
  kbBar.className = kbOpen ? 'show' : '';
  document.getElementById('btn-keyboard').className = kbOpen ? 'active' : '';
  if (kbOpen) setTimeout(() => kbInput.focus(), 100);
};
document.getElementById('btn-kb-close').onclick = () => {
  kbOpen = false; kbBar.className = '';
  document.getElementById('btn-keyboard').className = '';
  kbInput.blur();
};
document.getElementById('btn-send-text').onclick = () => {
  const text = kbInput.value;
  if (text) { for (const c of text) send({ type: 'key_char', char: c }); kbInput.value = ''; }
  kbInput.focus();
};

document.getElementById('btn-click').onclick = () => {
  document.getElementById('btn-click').className = 'active';
  document.getElementById('btn-rclick').className = '';
  clickMode = 'left';
};
document.getElementById('btn-rclick').onclick = () => {
  document.getElementById('btn-rclick').className = 'active';
  document.getElementById('btn-click').className = '';
  clickMode = 'right';
};
document.getElementById('btn-esc').onclick = () => send({ type: 'key_special', key: 'escape' });
document.getElementById('btn-tab').onclick = () => send({ type: 'key_special', key: 'tab' });
document.getElementById('btn-enter').onclick = () => send({ type: 'key_special', key: 'enter' });
document.getElementById('btn-bs').onclick = () => send({ type: 'key_special', key: 'backspace' });
document.getElementById('btn-winkey').onclick = () => send({ type: 'key_special', key: 'win' });

// Desktop keyboard capture
document.addEventListener('keydown', (e) => {
  if (document.activeElement === kbInput) return;
  const special = {
    'Backspace': 'backspace', 'Delete': 'delete', 'ArrowLeft': 'left',
    'ArrowRight': 'right', 'ArrowUp': 'up', 'ArrowDown': 'down',
    'Enter': 'enter', 'Escape': 'escape', 'Tab': 'tab',
    'Home': 'home', 'End': 'end', 'PageUp': 'pageup', 'PageDown': 'pagedown',
    'F1': 'f1', 'F2': 'f2', 'F3': 'f3', 'F4': 'f4', 'F5': 'f5', 'Meta': 'win',
  };
  if (special[e.key]) {
    e.preventDefault();
    send({ type: 'key_special', key: special[e.key] });
  } else if (e.ctrlKey || e.altKey || e.metaKey) {
    e.preventDefault();
    const mods = [];
    if (e.ctrlKey) mods.push('ctrl');
    if (e.altKey) mods.push('alt');
    if (e.shiftKey) mods.push('shift');
    mods.push(e.key.toLowerCase());
    send({ type: 'key_combo', keys: mods });
  } else if (e.key.length === 1) {
    e.preventDefault();
    send({ type: 'key_char', char: e.key });
  }
});

// Mouse wheel
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const pos = canvasToScreen(e.clientX, e.clientY);
  send({ type: 'mouse_scroll', x: pos.x, y: pos.y, dx: e.deltaX, dy: e.deltaY });
}, { passive: false });

// Right-click
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const pos = canvasToScreen(e.clientX, e.clientY);
  send({ type: 'mouse_click', button: 'right', x: pos.x, y: pos.y });
});

// On canvas: prevent default touch (we handle clicks ourselves)
// Outside canvas: allow pinch zoom and scroll
canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

connect();
</script>
</body>
</html>
