<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NB Remote</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #eee; font-family: system-ui, sans-serif; }
body, img, #toolbar, #status { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
#kb-bar input { -webkit-user-select: text; user-select: text; }

#status { position: fixed; top: 0; left: 0; right: 0; height: 22px; line-height: 22px; font-size: 11px; background: #16213e; text-align: center; z-index: 10; }
#status.connected { background: #0f3d0f; }
#status.waiting { background: #3d2e0f; }

/* Image positioned by JS — no CSS layout dependency */
#screen { position: fixed; touch-action: none; cursor: crosshair; }

#toolbar { position: fixed; bottom: 0; left: 0; right: 0; height: 30px; display: flex; gap: 3px; padding: 2px 4px; background: #16213e; justify-content: center; align-items: center; z-index: 10; overflow-x: auto; }
#toolbar button { padding: 2px 7px; border: 1px solid #444; border-radius: 4px; background: #0f3460; color: #eee; font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
#toolbar button:active { background: #e94560; }
#toolbar button.active { background: #e94560; border-color: #e94560; }

#kb-bar { position: fixed; bottom: 30px; left: 0; right: 0; display: none; padding: 3px 6px; background: #0a0a1a; z-index: 10; gap: 4px; align-items: center; }
#kb-bar.show { display: flex; }
#kb-bar input { flex: 1; padding: 5px 8px; border: 1px solid #555; border-radius: 4px; background: #1a1a2e; color: #eee; font-size: 14px; outline: none; }
#kb-bar input:focus { border-color: #e94560; }
#kb-bar button { padding: 5px 8px; border: 1px solid #444; border-radius: 4px; background: #0f3460; color: #eee; font-size: 12px; cursor: pointer; flex-shrink: 0; }

#debug { position: fixed; top: 24px; left: 4px; background: rgba(0,0,0,0.9); color: #0f0; font-size: 10px; padding: 4px 6px; z-index: 20; border-radius: 4px; font-family: monospace; line-height: 1.4; pointer-events: none; white-space: pre; }
</style>
</head>
<body>

<div id="status" class="waiting">Connecting... (v2.1)</div>
<img id="screen" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
<div id="toolbar">
  <button id="btn-pause">⏸</button>
  <button id="btn-keyboard">⌨</button>
  <button id="btn-click">L</button>
  <button id="btn-rclick">R</button>
  <button id="btn-esc">Esc</button>
  <button id="btn-tab">Tab</button>
  <button id="btn-enter">⏎</button>
  <button id="btn-bs">⌫</button>
  <button id="btn-winkey">⊞</button>
</div>
<div id="kb-bar">
  <input id="keyboard-input" type="text" placeholder="Type here..." autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
  <button id="btn-send-text">Send</button>
  <button id="btn-kb-close">✕</button>
</div>
<div id="debug"></div>

<script>
const screenImg = document.getElementById('screen');
const statusEl = document.getElementById('status');
const kbInput = document.getElementById('keyboard-input');
const debugEl = document.getElementById('debug');

let ws = null;
let screenW = 1280, screenH = 800;
let clickMode = 'left';
let connected = false;
let paused = false;
let frameCount = 0;

// JS-calculated layout: position image precisely
function layoutImage() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const statusH = 22;
  const toolbarH = 30;
  const areaW = vw;
  const areaH = vh - statusH - toolbarH;
  const natW = screenImg.naturalWidth || 512;
  const natH = screenImg.naturalHeight || 320;
  const scale = Math.min(areaW / natW, areaH / natH);
  const imgW = Math.floor(natW * scale);
  const imgH = Math.floor(natH * scale);
  const left = Math.floor((areaW - imgW) / 2);
  const top = statusH + Math.floor((areaH - imgH) / 2);

  screenImg.style.left = left + 'px';
  screenImg.style.top = top + 'px';
  screenImg.style.width = imgW + 'px';
  screenImg.style.height = imgH + 'px';

  debugEl.textContent =
    `vp: ${vw}x${vh}  area: ${areaW}x${areaH}\n` +
    `nat: ${natW}x${natH}  scale: ${scale.toFixed(3)}\n` +
    `img: ${imgW}x${imgH}  pos: ${left},${top}\n` +
    `frames: ${frameCount}`;
}

window.addEventListener('resize', layoutImage);
screenImg.addEventListener('load', layoutImage);

function imgToScreen(clientX, clientY) {
  const rect = screenImg.getBoundingClientRect();
  const relX = (clientX - rect.left) / rect.width;
  const relY = (clientY - rect.top) / rect.height;
  return {
    x: Math.max(0, Math.min(screenW, Math.round(relX * screenW))),
    y: Math.max(0, Math.min(screenH, Math.round(relY * screenH)))
  };
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/phone`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    statusEl.textContent = 'Waiting for NB... (v2.1)';
    statusEl.className = 'waiting';
  };

  ws.onmessage = (ev) => {
    if (ev.data instanceof ArrayBuffer) {
      const blob = new Blob([ev.data], { type: 'image/jpeg' });
      const url = URL.createObjectURL(blob);
      screenImg.onload = () => { URL.revokeObjectURL(url); layoutImage(); };
      screenImg.src = url;
      frameCount++;
    } else {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'frame' && msg.data) {
          screenImg.src = 'data:image/jpeg;base64,' + msg.data;
          frameCount++;
          layoutImage();
        } else if (msg.type === 'nb_status') {
          connected = msg.connected;
          if (!paused) {
            statusEl.textContent = connected ? '● NB Connected (v2.1)' : 'Waiting for NB... (v2.1)';
            statusEl.className = connected ? 'connected' : 'waiting';
          }
        } else if (msg.type === 'screen_info') {
          screenW = msg.width;
          screenH = msg.height;
        }
      } catch(e) {}
    }
  };

  ws.onclose = () => {
    statusEl.textContent = 'Reconnecting...';
    statusEl.className = '';
    connected = false;
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();
}

function send(obj) {
  if (paused) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// Touch
screenImg.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  const pos = imgToScreen(t.clientX, t.clientY);
  send({ type: 'mouse_click', button: clickMode, x: pos.x, y: pos.y });
  clickMode = 'left';
}, { passive: false });

// Mouse
screenImg.addEventListener('click', (e) => {
  const pos = imgToScreen(e.clientX, e.clientY);
  send({ type: 'mouse_click', button: clickMode, x: pos.x, y: pos.y });
  clickMode = 'left';
});
screenImg.addEventListener('dblclick', (e) => {
  e.preventDefault();
  const pos = imgToScreen(e.clientX, e.clientY);
  send({ type: 'mouse_dblclick', button: 'left', x: pos.x, y: pos.y });
});
screenImg.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const pos = imgToScreen(e.clientX, e.clientY);
  send({ type: 'mouse_click', button: 'right', x: pos.x, y: pos.y });
});
screenImg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const pos = imgToScreen(e.clientX, e.clientY);
  send({ type: 'mouse_scroll', x: pos.x, y: pos.y, dx: e.deltaX, dy: e.deltaY });
}, { passive: false });

// Keyboard input bar
kbInput.addEventListener('keydown', (e) => {
  e.stopPropagation();
  const special = {
    'Backspace': 'backspace', 'Delete': 'delete', 'ArrowLeft': 'left',
    'ArrowRight': 'right', 'ArrowUp': 'up', 'ArrowDown': 'down',
    'Enter': 'enter', 'Escape': 'escape', 'Tab': 'tab',
  };
  if (special[e.key]) {
    e.preventDefault();
    send({ type: 'key_special', key: special[e.key] });
  } else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
    e.preventDefault();
    send({ type: 'key_char', char: e.key });
  }
});

// Toolbar
const kbBar = document.getElementById('kb-bar');
let kbOpen = false;

document.getElementById('btn-pause').onclick = () => {
  paused = !paused;
  const btn = document.getElementById('btn-pause');
  btn.textContent = paused ? '▶' : '⏸';
  btn.className = paused ? 'active' : '';
  statusEl.textContent = paused ? '⏸ PAUSED' : (connected ? '● NB Connected (v2.1)' : 'Waiting for NB... (v2.1)');
};
document.getElementById('btn-keyboard').onclick = () => {
  kbOpen = !kbOpen;
  kbBar.className = kbOpen ? 'show' : '';
  document.getElementById('btn-keyboard').className = kbOpen ? 'active' : '';
  if (kbOpen) setTimeout(() => kbInput.focus(), 100);
};
document.getElementById('btn-kb-close').onclick = () => {
  kbOpen = false; kbBar.className = '';
  document.getElementById('btn-keyboard').className = '';
  kbInput.blur();
};
document.getElementById('btn-send-text').onclick = () => {
  const text = kbInput.value;
  if (text) { for (const c of text) send({ type: 'key_char', char: c }); kbInput.value = ''; }
  kbInput.focus();
};

document.getElementById('btn-click').onclick = () => {
  document.getElementById('btn-click').className = 'active';
  document.getElementById('btn-rclick').className = '';
  clickMode = 'left';
};
document.getElementById('btn-rclick').onclick = () => {
  document.getElementById('btn-rclick').className = 'active';
  document.getElementById('btn-click').className = '';
  clickMode = 'right';
};
document.getElementById('btn-esc').onclick = () => send({ type: 'key_special', key: 'escape' });
document.getElementById('btn-tab').onclick = () => send({ type: 'key_special', key: 'tab' });
document.getElementById('btn-enter').onclick = () => send({ type: 'key_special', key: 'enter' });
document.getElementById('btn-bs').onclick = () => send({ type: 'key_special', key: 'backspace' });
document.getElementById('btn-winkey').onclick = () => send({ type: 'key_special', key: 'win' });

// Desktop keyboard capture
document.addEventListener('keydown', (e) => {
  if (document.activeElement === kbInput) return;
  const special = {
    'Backspace': 'backspace', 'Delete': 'delete', 'ArrowLeft': 'left',
    'ArrowRight': 'right', 'ArrowUp': 'up', 'ArrowDown': 'down',
    'Enter': 'enter', 'Escape': 'escape', 'Tab': 'tab',
    'Home': 'home', 'End': 'end', 'PageUp': 'pageup', 'PageDown': 'pagedown',
    'F1': 'f1', 'F2': 'f2', 'F3': 'f3', 'F4': 'f4', 'F5': 'f5', 'Meta': 'win',
  };
  if (special[e.key]) {
    e.preventDefault();
    send({ type: 'key_special', key: special[e.key] });
  } else if (e.ctrlKey || e.altKey || e.metaKey) {
    e.preventDefault();
    const mods = [];
    if (e.ctrlKey) mods.push('ctrl');
    if (e.altKey) mods.push('alt');
    if (e.shiftKey) mods.push('shift');
    mods.push(e.key.toLowerCase());
    send({ type: 'key_combo', keys: mods });
  } else if (e.key.length === 1) {
    e.preventDefault();
    send({ type: 'key_char', char: e.key });
  }
});

// Prevent mobile gestures
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

connect();
layoutImage();
</script>
</body>
</html>
